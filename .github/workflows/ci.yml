name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # timers, CPU times and core probes differ per platform
        os: [ubuntu-latest, windows-latest, macos-latest]
        # dev tooling (vitest, eslint) needs Node 22.12+
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # needs mm-logger from npm: a file:../mm-logger dependency only
      # resolves in a checkout next to mm-logger's
      - run: npm ci
      - run: npm run check
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run
